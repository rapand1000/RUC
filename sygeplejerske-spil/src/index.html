<!--
================================================================================
  EN VAGT SOM SYGEPLEJERSKE · index.html  (selve spillet)
  RUC · Digital Transformation · Designmetoder og Teknologi · Workshop #3
--------------------------------------------------------------------------------
  Hvad er det?   Et interaktivt beslutningsspil, hvor spilleren tager en dagvagt
                 som sygeplejerske (kl. 06.50-15.00) og træffer valg under pres.
  Hvorfor?       Prototypen er et designeksperiment (Research through Design):
                 vi undersøger, hvordan unge oplever ansvar og dilemmaer i plejen,
                 og hvordan digitale systemer former beslutningerne.
  Hvordan?       Én HTML-fil med CSS og JavaScript. Ingen frameworks.
                 Filen serveres af Google Apps Script (se Code.gs) og sender
                 hvert valg til et Google Sheet via google.script.run.
  Layout (én kolonne, oppefra og ned, som i gruppens skitse):
     tegneserie → situation + nedtælling → 4 svar → tidslinje → patientovervågning

  Læsevejledning: Koden er delt i nummererede afsnit. Numrene bruges også i
  docs/kodeguide.md, så man kan slå op fra dokumentationen til koden.
     [S1]-[S9]   = udseende (CSS)        [H1]-[H3]   = struktur (HTML)
     [K1]-[K18]  = funktioner (JavaScript)
================================================================================
-->
<title>En vagt som sygeplejerske</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* [S1] DESIGN-TOKENS OG TEMA
   Alle farver er defineret som CSS-variabler (--navn) ét sted. Resten af koden
   bruger kun variablerne, så lys/mørk tilstand og farveskift kan styres her.
   --mon-*  = patientmonitorens farver (altid mørk, som en rigtig skærm).       */
:root{
  --bg:#E9EFF0; --surface:#FFFFFF; --ink:#14232A; --muted:#55686F; --line:#CCD8DB;
  --accent:#0D6B68; --accent-ink:#FFFFFF; --accent-soft:#D6EBE9;
  --alarm:#C2302A; --alarm-soft:#F8DEDB; --warn:#9A6200; --warn-soft:#F6E7C8;
  --mon-bg:#0A1315; --mon-line:#1E3034; --mon-ecg:#43D693; --mon-spo2:#4CC3E8; --mon-text:#B9CACD; --mon-alarm:#FF5A4E;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1619; --surface:#16232A; --ink:#E3ECEE; --muted:#93A6AC; --line:#2A3B41;
  --accent:#3FB7AF; --accent-ink:#06201F; --accent-soft:#163A39;
  --alarm:#FF6B60; --alarm-soft:#3A1A19; --warn:#E3A93A; --warn-soft:#3A2C12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1619; --surface:#16232A; --ink:#E3ECEE; --muted:#93A6AC; --line:#2A3B41;
  --accent:#3FB7AF; --accent-ink:#06201F; --accent-soft:#163A39;
  --alarm:#FF6B60; --alarm-soft:#3A1A19; --warn:#E3A93A; --warn-soft:#3A2C12; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}

/* [S2] TOPBJÆLKE: titel og små 'chips' med runde, klokkeslæt, forsøg og spiller. */
/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:clamp(24px,4vw,34px)}
.brand span{font-family:var(--display);font-weight:500;color:var(--muted);font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.btn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.04em}

/* [S3] TIDSLINJE: vagten fra 06.50 til 15.00 som en vandret linje. Fyldet viser, hvor
   langt dagen er nået, og de fem prikker er runderne (grøn = A, gul = B). */
.timeline{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px 10px}
.tl-head{display:flex;justify-content:space-between;gap:8px;white-space:nowrap;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tl-track{position:relative;height:6px;border-radius:3px;background:var(--line);margin:18px 6px 30px}
.tl-fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent);transition:width .6s}
.tl-stop{position:absolute;top:50%;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--muted)}
.tl-stop.A{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tl-stop.B{background:var(--warn);border-color:var(--warn);color:#fff}
.tl-stop.cur{border-color:var(--alarm);color:var(--alarm);box-shadow:0 0 0 4px var(--alarm-soft)}
.tl-stop span{position:absolute;top:26px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted)}
@media (max-width:600px){.tl-stop span{display:none}.tl-track{margin-bottom:12px}.tl-head .mid{display:none}}

/* [S4] NEDTÆLLING: en stor tæller ved siden af situationen (i stedet for en bjælke).
   Tælleren vises kun på stress-kortet og bliver rød de sidste 5 sekunder. */
.situ{display:flex;gap:14px;align-items:stretch}
.situ .card{flex:1}
.count{display:none;min-width:112px;border-radius:var(--r);background:var(--surface);border:2px solid var(--accent);flex-direction:column;align-items:center;justify-content:center;padding:10px;font-family:var(--mono)}
.count.on{display:flex}
.count b{font-family:var(--display);font-size:64px;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.count small{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.count.low{border-color:var(--alarm);background:var(--alarm-soft)}
.count.low b{color:var(--alarm);animation:blink .5s steps(2) infinite}
@media (max-width:560px){.situ{flex-direction:column}.count{flex-direction:row;gap:10px;min-width:0;padding:6px 12px;position:sticky;top:6px;z-index:2}.count b{font-size:40px}}

/* [S5] SPILLETS RAMMER I ÉN KOLONNE: tegneserie · situation · svar · tidslinje · monitor.
   Samme rækkefølge på pc og mobil, så skærmen læses oppefra og ned. */
.stage{display:flex;flex-direction:column;gap:14px}
@media (max-width:760px){.brand span{display:none}}

.monitor{background:var(--mon-bg);color:var(--mon-text);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0;border:1px solid var(--mon-line)}
.mon-head{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.mon-head b{color:#fff;font-weight:700}
.mon-alarm{color:var(--mon-alarm);visibility:hidden}
.monitor.alarm .mon-alarm{visibility:visible;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.ecg-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:18px;align-items:center}
@media (max-width:560px){.ecg-row{gap:10px}.vital strong{font-size:32px}.vital.spo2 strong{font-size:24px}}
canvas{width:100%;height:96px;display:block}
.vital{font-family:var(--mono);text-align:right;line-height:1}
.vital small{display:block;font-size:11px;letter-spacing:.1em;color:var(--mon-text)}
.vital strong{font-size:44px;font-weight:700;color:var(--mon-ecg);font-variant-numeric:tabular-nums}
.vital.spo2 strong{color:var(--mon-spo2);font-size:28px}
.monitor.alarm .vital strong{color:var(--mon-alarm)}
.ward{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:760px){.ward{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bed{border:1px solid var(--mon-line);border-left:5px solid var(--pc);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.3;transition:border-color .3s,background .3s}
.bed .no{font-family:var(--mono);font-size:11px;letter-spacing:.08em;opacity:.75}
.bed .nm{color:#fff;font-weight:700;display:flex;align-items:center;gap:6px}
.bed .dot{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none}
.bed.hot{outline:2px solid var(--pc);outline-offset:2px;background:rgba(255,255,255,.08)}
.bed.focus{border-color:var(--pc);background:rgba(255,255,255,.07)}
.monitor.alarm .bed.focus{border-color:var(--mon-alarm);background:rgba(255,90,78,.1)}
.monitor.alarm .bed.focus .dot{background:var(--mon-alarm);animation:blink .6s steps(2) infinite}

/* [S6] KORTET med situationen: info-, stress-, feedback-, game over- og slutkort. */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3vw,26px);display:flex;flex-direction:column;gap:12px;min-width:0}
.tag{align-self:flex-start;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;padding:3px 10px;border-radius:4px}
.tag.info{background:var(--accent-soft);color:var(--accent)}
.tag.stress{background:var(--alarm-soft);color:var(--alarm)}
.tag.feedback{background:var(--warn-soft);color:var(--warn)}
.tag.over{background:var(--alarm);color:#fff}
.tag.end{background:var(--accent);color:var(--accent-ink)}
.card h2{font-size:clamp(28px,4.4vw,40px)}
.card .meta{font-family:var(--mono);font-size:13px;color:var(--muted)}
.card p{margin:0;max-width:62ch}
.card .lead{font-size:18px}
.quote{border-left:3px solid var(--line);padding-left:12px;color:var(--muted);border-radius:0}
.big-x{font-family:var(--display);font-weight:700;font-size:clamp(44px,8vw,72px);color:var(--alarm);line-height:.95}

/* [S7] HANDLINGSKNAPPER: de fire valg og de store 'videre'-knapper. */
/* actions */
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.actions{grid-template-columns:repeat(2,minmax(0,1fr))}}
.actions.one{grid-template-columns:1fr}
.actions.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.key{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;min-height:86px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .1s}
.key:hover{border-color:var(--accent)}
.key:active{transform:translateY(1px)}
.key .k{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em}
.key .t{font-size:15px;line-height:1.35}
.key.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-height:60px;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em}
.key.rate{align-items:center;justify-content:center;min-height:64px;text-align:center}
.key.rate .n{font-family:var(--display);font-weight:700;font-size:28px}
.key.rate .t{font-size:12px;color:var(--muted)}
.key.rate.sel{border-color:var(--accent);background:var(--accent-soft)}
.key[disabled]{opacity:.45;cursor:default}

/* intro + end */
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:4px 0 0;padding:0;list-style:none}
@media (max-width:560px){.rules{grid-template-columns:1fr}}
.rules li{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.rules b{display:block;font-family:var(--display);font-size:20px;color:var(--accent)}
.path{display:flex;gap:6px;flex-wrap:wrap}
.path span{font-family:var(--mono);font-weight:700;width:34px;height:34px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--line)}
.path span.A{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.path span.B{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.note{font-size:13px;color:var(--muted)}

/* [S8] PATIENTNAVNE i teksten (farvet 'pille' med stuenummer), forskningsspørgsmål
   (knaprækker .opts) og tegneserien øverst. */
/* patient-navne, spørgsmål, side */
.pt{display:inline-flex;align-items:baseline;gap:4px;background:color-mix(in srgb,var(--pc) 28%,transparent);border-bottom:2px solid var(--pc);border-radius:4px;padding:0 4px;font-weight:700;white-space:nowrap}
.pt i{font-style:normal;font-family:var(--mono);font-size:.7em;font-weight:500;opacity:.8}
.qs{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.q{display:grid;gap:6px}
.q .sc{font-size:13px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;min-width:44px;font-size:15px}
.opt:hover{border-color:var(--accent)}
.opt.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.thanks{color:var(--accent);font-weight:700}
.actions.two{grid-template-columns:2fr 1fr}
@media (max-width:760px){.actions.two{grid-template-columns:1fr}}
.key.ghost{min-height:60px;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;font-size:18px}
.side{min-width:0}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.strip svg{width:100%;height:auto;display:block}
@media (max-width:640px){.strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}.strip svg{min-width:78%;scroll-snap-align:start}}
/* [S9] PROFILFORMULAR før vagten. */
/* profil */
.form{display:grid;gap:12px;max-width:520px}
.field{display:grid;gap:4px}
.field label{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.03em}
.field small{color:var(--muted);font-size:13px}
.field input,.field select,.field textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;box-sizing:border-box}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
.err{color:var(--alarm);font-size:13px;min-height:1em}
/* results */
.results{display:flex;flex-direction:column;gap:14px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{font-size:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.bar-row{display:grid;grid-template-columns:72px minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:14px}
.bar-row .lbl{font-family:var(--mono);font-size:13px}
.bar-row .val{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:16px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.bar .a{background:var(--accent)} .bar .b{background:var(--warn)} .bar .x{background:var(--alarm)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.qr{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qr #qrbox{background:#fff;padding:10px;border-radius:8px;line-height:0}
.qr .url{font-family:var(--mono);font-size:13px;word-break:break-all;user-select:all}
.empty{color:var(--muted);font-size:15px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<!-- [H1] SIDESTRUKTUR. JavaScript fylder indholdet i de tomme elementer:
     #side (tegneserie), #card (situationen), #count (nedtælling), #actions (svar),
     #timeline (tidslinje) og #ward (patientstuerne). Elementer findes med $("id"). -->
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>En vagt som sygeplejerske</h1><span>Medicinsk afd. · dagvagt</span></div>
    <div class="chips">
      <span class="chip" id="chipRound">Runde –/5</span>
      <span class="chip" id="chipClock">Kl. 06.55</span>
      <span class="chip" id="chipTry">Forsøg 1</span>
      <button class="chip" id="chipWho" title="Skift profil" hidden></button>
    </div>
  </header>

  <!-- [H2] SPILLETS RAMMER oppefra og ned, som i skitsen:
       1 billedet af situationen (tegneserie [K12])
       2 situationen + nedtælling i tal [K14] [K15]
       3 de fire svarmuligheder
       4 tidslinjen for vagten [K13]
       5 patientovervågningen med puls, stressindikator og de fire patienter [K10] -->
  <main id="game" class="stage">
    <section class="side" id="side" aria-label="Billedet af situationen"></section>
    <div class="situ">
      <article class="card" id="card" aria-live="polite"></article>
      <div class="count" id="count" role="timer" aria-label="Sekunder tilbage"><b id="countN">15</b><small>sek.</small></div>
    </div>
    <div class="actions" id="actions"></div>
    <section class="timeline" id="timeline" aria-label="Tidslinje for vagten"></section>
    <!-- [H3] PATIENTOVERVÅGNING: EKG og puls, stressindikator og de fire stuer. -->
    <section class="monitor" id="monitor" aria-label="Patientovervågning">
      <div class="mon-head"><span>Patientovervågning · <b id="monRoom">Vagtstuen</b></span><span class="mon-alarm">● Alarm</span></div>
      <div class="ecg-row">
        <canvas id="ecg" aria-hidden="true"></canvas>
        <div class="vital"><small>DIN PULS</small><strong id="hr">72</strong></div>
        <div class="vital spo2"><small>STRESS</small><strong id="stressV">0</strong></div>
      </div>
      <div class="note" style="color:var(--mon-text);font-size:12px" id="monNote">Pulsen stiger, når tiden løber.</div>
      <div class="ward" id="ward"></div>
    </section>
  </main>

</div>

<script>
/* =============================================================================
   JAVASCRIPT
   Spillet er en lille "tilstandsmaskine": variablen S.phase fortæller, hvilken
   skærm der vises (profile → start → info → stress → feedback/over → ... → end),
   og funktionen render() [K14] tegner skærmen ud fra den.
   ============================================================================= */

/* [K1] GRUNDOPSÆTNING: tid pr. valg, de fire patienter og de fem runder. */
const SECONDS = 15;

const PATIENTS = {
  J:{no:"Stue 1",nm:"Hr. Jensen",info:"78 år · KOL · får ilt"},
  H:{no:"Stue 2",nm:"Fru Hansen",info:"84 år · hoftebrud · let dement"},
  A:{no:"Stue 3",nm:"Ahmed",info:"45 år · type 1-diabetes"},
  B:{no:"Stue 4",nm:"Birthe",info:"67 år · lungebetændelse"}
};
const ROUNDS = {1:{time:"07.00",theme:"Overlevering",room:"Vagtstuen"},2:{time:"08.30",theme:"Medicinrunden",room:"Medicinrummet"},3:{time:"10.00",theme:"Alarmer",room:"Gangen"},4:{time:"12.00",theme:"Pårørende vs. skærmen",room:"Kontoret"},5:{time:"14.30",theme:"Udskrivelse og vagtskifte",room:"Kontoret"}};

/* [K2] HISTORIETRÆET – spillets indhold.
   Hver nøgle er et "node-ID", der fortæller vejen hertil:
     R1        = runde 1 (alle starter her)
     R3-AB     = runde 3, efter valg A i runde 1 og B i runde 2
   Hver node har:
     f      = hvilke patienter (J/H/A/B) situationen handler om (lyser på monitoren)
     alarm  = 1 hvis monitoren skal blinke rødt
     title, sit = overskrift og situation (info-kortet)
     c      = de fire valg: A og B fører videre, X1 og X2 er "skøre" og giver game over
     fb     = feedback-teksten, der kobler situationen til digital transformation
   2 rigtige valg pr. runde i 5 runder = 31 noder og 32 mulige slutninger.        */

/* ---------- state ---------- */
const $ = id => document.getElementById(id);

/* [K7] DATALAGET. google.script.run er Googles bro fra browseren til serverkoden.

/* ---------- data (Google Apps Script) ---------- */
const gs = () => (window.google && google.script && google.script.run) ? google.script.run : null;

/* [K10] PATIENTOVERVÅGNINGEN (nederst).
   renderWard() tegner de fire stuer og fremhæver dem, situationen handler om.
   setVitals() sætter puls, stress og alarm. EKG-kurven tegnes løbende på et
   <canvas> med requestAnimationFrame; hastigheden følger pulsen (S.hr). */
/* ---------- monitor ---------- */
function renderWard(focus=""){
  $("ward").innerHTML = Object.entries(PATIENTS).map(([k,p])=>
    `<div class="bed ${focus.includes(k)?"focus":""}" data-p="${k}" style="--pc:${PCOL[k]}"><div class="no">${p.no}</div><div class="nm"><span class="dot"></span>${p.nm}</div><div>${p.info}</div></div>`).join("");
}
function setVitals(hr, stress, alarm, room, note){
  S.hr = hr; $("hr").textContent = Math.round(hr);
  $("stressV").textContent = stress;
  $("monitor").classList.toggle("alarm", !!alarm);
  if(room) $("monRoom").textContent = room;
  if(note) $("monNote").textContent = note;
}
const cv = $("ecg"), cx = cv.getContext("2d");
let ecgX = 0, ecgPhase = 0, lastY = 0, lastT = 0;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function sizeCanvas(){ const r = cv.getBoundingClientRect(); cv.width = Math.max(200, r.width*devicePixelRatio); cv.height = 96*devicePixelRatio; ecgX = 0; }
function beat(p){
  if(p<.10) return Math.sin(p/.10*Math.PI)*.12;
  if(p<.16) return 0;
  if(p<.18) return -.15;
  if(p<.21) return 1;
  if(p<.24) return -.3;
  if(p<.40) return 0;
  if(p<.55) return Math.sin((p-.40)/.15*Math.PI)*.25;
  return 0;
}
function ecgTick(t){
  const dt = Math.min(50, t-(lastT||t)); lastT = t;
  const w = cv.width, h = cv.height, step = 1.4*devicePixelRatio*dt/16;
  ecgPhase += dt/1000 * (S.hr/60);
  const y = h*.62 - beat(ecgPhase%1)*h*.5;
  cx.fillStyle = "#0A1315"; cx.fillRect(ecgX, 0, 14*devicePixelRatio, h);
  cx.strokeStyle = $("monitor").classList.contains("alarm") ? "#FF5A4E" : "#43D693";
  cx.lineWidth = 2*devicePixelRatio; cx.beginPath(); cx.moveTo(ecgX, lastY||y); cx.lineTo(ecgX+step, y); cx.stroke();
  lastY = y; ecgX += step; if(ecgX > w){ ecgX = 0; lastY = 0; }
  requestAnimationFrame(ecgTick);
}
function staticEcg(){ const w=cv.width,h=cv.height; cx.fillStyle="#0A1315";cx.fillRect(0,0,w,h); cx.strokeStyle="#43D693";cx.lineWidth=2*devicePixelRatio;cx.beginPath(); for(let x=0;x<w;x++){const y=h*.62-beat((x/(w/4))%1)*h*.5; x?cx.lineTo(x,y):cx.moveTo(x,y);} cx.stroke(); }
sizeCanvas(); addEventListener("resize", ()=>{sizeCanvas(); if(reduce) staticEcg();});
reduce ? staticEcg() : requestAnimationFrame(ecgTick);

/* [K11] HJÆLPEFUNKTIONER
   esc()       beskytter mod HTML i tekst (sikkerhed).
   hl()        finder patientnavne i teksten og laver dem til farvede "piller"
               med stuenummer, så tekst og monitor hænger sammen.
   clockNow()  regner klokkeslættet ud: 06.50 ved start, derefter 5 min pr. kort.
   opts()/bindOpts()  bygger og lytter på knaprækkerne til spørgsmålene.          */
/* ---------- helpers ---------- */
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NAMES = {"Hr. Jensen":"J","Fru Hansen":"H","Ahmed":"A","Birthe":"B"};
const hl = s => esc(s).replace(/(Hr\. Jensen|Fru Hansen|Ahmed|Birthe)(s?)/g, (m,n,poss)=>{ const k = NAMES[n]; return `<span class="pt" data-p="${k}" style="--pc:${PCOL[k]}">${n}${poss}<i>${PATIENTS[k].no}</i></span>`; });
const mentioned = s => Object.keys(NAMES).filter(n=>s.includes(n)).map(n=>NAMES[n]).join("");
const roundOf = id => +id[1];
const fmt = m => String(Math.floor(m/60)).padStart(2,"0")+"."+String(m%60).padStart(2,"0");
function clockNow(){
  if(!S.node || S.phase==="start" || S.phase==="profile") return 410;
  if(S.phase==="end") return 900;
  const a = ANCHOR[roundOf(S.node)];
  return S.phase==="info" ? a-5 : (S.phase==="stress"||S.phase==="over") ? a : a+5;
}
function chips(){
  const r = S.node && S.phase!=="start" && S.phase!=="profile" ? roundOf(S.node) : 0;
  $("chipRound").textContent = r ? `Runde ${r}/5` : "Runde –/5";
  $("chipClock").textContent = "Kl. " + fmt(clockNow());
  $("chipTry").textContent = "Forsøg " + S.attempt;
  const c = $("chipWho"); c.hidden = !profile; if(profile) c.textContent = profile.nick;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function stopTimer(){ cancelAnimationFrame(S.raf); $("count").classList.remove("on","low"); }
function opts(name, list, sel, labels){
  return `<div class="opts" data-q="${name}">${list.map((v,i)=>`<button type="button" class="opt ${sel==v?"sel":""}" data-v="${esc(v)}">${esc(labels?labels[i]:v)}</button>`).join("")}</div>`;
}
function bindOpts(store, onChange){
  document.querySelectorAll("#card .opts").forEach(g=>{
    g.querySelectorAll(".opt").forEach(b=> b.onclick = ()=>{
      store[g.dataset.q] = b.dataset.v;
      g.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel", x===b));
      const e = $("qerr"); if(e) e.textContent = "";
      onChange && onChange();
    });
  });
}

   person(), patientBed() og prop() tegner figurer og ting, panel() samler et panel
   med taleboble, der selv ombrydes til max 3 linjer. */
/* ---------- comic + tidslinje ---------- */
function wrap(t, n){ const w = t.split(" "), out=[""]; w.forEach(x=>{ if((out[out.length-1]+" "+x).trim().length>n && out[out.length-1]) out.push(x); else out[out.length-1]=(out[out.length-1]+" "+x).trim(); }); return out.slice(0,3); }

  s += `<rect x="-17" y="92" width="34" height="40" rx="11" fill="${p.c}" stroke="#14232A" stroke-width="2"/>`;
  if(p.coat) s += `<rect x="-3" y="94" width="6" height="34" fill="#4CC3E8"/>`;
  s += `<circle cx="0" cy="76" r="15" fill="${skin}" stroke="#14232A" stroke-width="2"/>`;
  s += `<path d="M-15 72 Q0 54 15 72 Q8 64 0 64 Q-8 64 -15 72Z" fill="${hair}"/>`;
  if(p.cap) s += `<rect x="-11" y="57" width="22" height="7" rx="2" fill="#FFFFFF" stroke="#14232A" stroke-width="1.5"/><path d="M-2 60h4M0 58v4" stroke="#C2302A" stroke-width="1.5"/>`;
  s += `<circle cx="-5" cy="77" r="1.8" fill="#14232A"/><circle cx="5" cy="77" r="1.8" fill="#14232A"/><path d="M-5 84 Q0 87 5 84" fill="none" stroke="#14232A" stroke-width="1.5"/>`;
  return s + `</g>`;
}

  return `<g transform="translate(${x},0)"><rect x="-40" y="104" width="80" height="18" rx="4" fill="#DDE6E8" stroke="#14232A" stroke-width="2"/><rect x="-40" y="122" width="6" height="12" fill="#14232A"/><rect x="34" y="122" width="6" height="12" fill="#14232A"/>
  <rect x="-36" y="94" width="22" height="12" rx="5" fill="#FFFFFF" stroke="#14232A" stroke-width="1.5"/><circle cx="-24" cy="88" r="12" fill="#F2C9A5" stroke="#14232A" stroke-width="2"/>
  <path d="M-29 88 h3 M-22 88 h3" stroke="#14232A" stroke-width="1.5"/><rect x="-12" y="92" width="50" height="16" rx="6" fill="${c}" stroke="#14232A" stroke-width="2"/>
  <text x="18" y="104" text-anchor="middle" font-size="10" font-family="JetBrains Mono,monospace" fill="#14232A">${PATIENTS[code].no.replace("Stue ","")}</text></g>`;
}

function actor(code, x){ if(PCOL[code]) return patientBed(code, x); if(PEOPLE[code]) return person(code, x); return prop(code, x); }
function panel(spec, i){
  const [l, r, who, txt] = spec, bgs = ["#EAF4F2","#FFF6E5","#EEF0FB"];
  const lines = wrap(txt, 18), bw = Math.max(...lines.map(s=>s.length))*7.7+20, bh = lines.length*15+12;
  const sx = who==="r" ? 186 : 66, bx = Math.min(Math.max(sx - bw/2, 6), 254-bw);
  const tail = `<path d="M${sx-6} ${8+bh-1} L${sx} ${8+bh+10} L${sx+6} ${8+bh-1}" fill="#FFFFFF" stroke="#14232A" stroke-width="2"/>`;
  const bubble = txt ? `<rect x="${bx}" y="8" width="${bw}" height="${bh}" rx="10" fill="#FFFFFF" stroke="#14232A" stroke-width="2"/>${tail}<rect x="${sx-5}" y="${8+bh-3}" width="10" height="4" fill="#FFFFFF"/>`+
    lines.map((s,k)=>`<text x="${bx+bw/2}" y="${8+18+k*15}" text-anchor="middle" font-size="14" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="600" fill="#14232A">${esc(s)}</text>`).join("") : "";
  return `<svg viewBox="0 0 260 140" role="img" aria-label="${esc(txt)}"><rect x="1" y="1" width="258" height="138" rx="6" fill="${bgs[i%3]}" stroke="#14232A" stroke-width="2"/><path d="M2 132 H258" stroke="#C9D6D8" stroke-width="2"/>${actor(l,66)}${actor(r,190)}${bubble}</svg>`;
}
/* [K13] renderSide() viser tegneserien for den aktuelle node.
   renderTimeline() tegner tidslinjen: 06.50 (410 min.) til 15.00 (900 min.), en prik
   pr. runde ved rundens ur-anker (ANCHOR), farvet efter valget (A/B). Fyldet viser "nu",
   og den aktuelle runde har en rød ring. */
function renderSide(){
  const side = $("side"); if(!side) return;
  const key = (S.phase==="start"||S.phase==="profile"||!S.node) ? "START" : S.node;
  side.innerHTML = `<div class="strip">${(COMICS[key]||COMICS.START).map(panel).join("")}</div>`;
}
function renderTimeline(){
  const t = $("timeline"); if(!t) return;
  const START = 410, END = 900, pos = m => ((m-START)/(END-START)*100).toFixed(2)+"%";
  const now = clockNow(), cur = S.node && !["start","profile","end"].includes(S.phase) ? roundOf(S.node) : 0;
  const stops = [1,2,3,4,5].map(r=>{
    const c = S.path[r-1] || "", cls = c ? c : (r===cur ? "cur" : "");
    return `<div class="tl-stop ${cls}" style="left:${pos(ANCHOR[r])}" title="Kl. ${fmt(ANCHOR[r])} · ${esc(ROUNDS[r].theme)}">${c||r}<span>${esc(ROUNDS[r].theme)}</span></div>`;
  }).join("");
  t.innerHTML = `<div class="tl-head"><span>Kl. 06.50</span><span class="mid">Tidslinje · nu kl. ${fmt(now)}</span><span>Kl. 15.00</span></div>
    <div class="tl-track"><div class="tl-fill" style="width:${pos(now)}"></div>${stops}</div>`;
}

     over      game over + "hvem havde ansvaret?"                      → gemmes i "Valg"
     feedback  forklaring + pres, sikkerhed, følt ansvar og "hvad styrede dit valg" → "Valg"

    card.innerHTML = `<span class="tag info">Info · ${esc(R.theme)}</span>

    renderWard(focus); setVitals(95+r*6, S.stress, !!n.alarm, R.room, "Vælg nu.");

      <div class="meta">Kl. ${fmt(clockNow())} · ${S.node}</div>

    const keys = shuffle(["A","B","X1","X2"]);
    act.innerHTML = keys.map((k,i)=>`<button class="key" data-k="${k}"><span class="k">${i+1}</span><span class="t">${hl(n.c[k][0])}</span></button>`).join("");

    card.innerHTML = `<span class="tag over">Game over · Kl. ${fmt(clockNow())}</span>
      <div class="big-x">${o.kind==="død" ? "Patient død" : "Du er fyret"}</div>

        <div class="q"><b>Hvor meget føltes beslutningen som dit ansvar?</b><span class="sc">1 = ikke mit · 5 = helt mit</span>${opts("ansvar_foelt",[1,2,3,4,5],f.ansvar_foelt)}</div>

  else if(S.phase==="end"){
    const a = [...S.path].filter(c=>c==="A").length, prof = PROFILES[a], e = S.end;

    card.innerHTML = `<span class="tag end">Vagten er slut · Kl. 15.00</span>

      <p>Du valgte systemet (A) ${a} gange og genvejen (B) ${5-a} gange. Ingen profil er fejlfri. Hver vej har en pris, og det er designet af arbejdsgangene, der bestemmer prisen.</p>
      ${S.saved ? `<p class="thanks">Tak for dine svar. De er gemt.</p>` : `<div class="qs">
        <div class="q"><b>Nu hvor du har prøvet det: ${PREPOST.ansvar.q.charAt(0).toLowerCase()+PREPOST.ansvar.q.slice(1)}</b><span class="sc">${PREPOST.ansvar.sc}</span>${opts("ansvar_efter",[1,2,3,4,5],e.ansvar_efter)}</div>
        <div class="q"><b>Og: ${PREPOST.svaert.q.charAt(0).toLowerCase()+PREPOST.svaert.q.slice(1)}</b><span class="sc">${PREPOST.svaert.sc}</span>${opts("svaert_efter",[1,2,3,4,5],e.svaert_efter)}</div>
        <div class="q"><b>Hvor virkelig føltes vagten?</b><span class="sc">1 = slet ikke · 5 = som en rigtig vagt</span>${opts("realisme",[1,2,3,4,5],e.realisme)}</div>
        <div class="q"><b>Hvilket dilemma var sværest?</b>${opts("svaerest",[1,2,3,4,5],e.svaerest,["Runde 1","Runde 2","Runde 3","Runde 4","Runde 5"])}</div>
        <div class="q"><b>Har spillet ændret dit syn på plejepersonalets ansvar?</b><span class="sc">1 = slet ikke · 5 = meget</span>${opts("synsaendring",[1,2,3,4,5],e.synsaendring)}</div>
        <div class="q"><b>Overvejer du nu et job i plejen?</b>${opts("interesse_efter",["Ja","Måske","Nej"],e.interesse_efter)}</div>
        <div class="field"><label for="surp">Hvad overraskede dig mest? <small>(frivilligt)</small></label><textarea id="surp" maxlength="300">${esc(e.overrasket||"")}</textarea></div>
      </div><div class="err" id="qerr"></div>`}`;
    if(!S.saved) bindOpts(S.end);
    act.className = "actions two";
    act.innerHTML = S.saved ? `<button class="key primary" id="again">Tag en ny vagt</button><button class="key ghost" id="np">Ny spiller</button>`
      : `<button class="key primary" id="send">Gem mine svar</button><button class="key ghost" id="np">Ny spiller</button>`;
    if(S.saved) $("again").onclick = ()=>{ S.attempt=1; S.saved=false; newGame(); S.node=null; S.phase="start"; render(); };
    else $("send").onclick = ()=>{
      const m = [["ansvar_efter","ansvar"],["svaert_efter","beslutninger"],["realisme","hvor virkelig"],["svaerest","sværeste dilemma"],["synsaendring","syn på ansvar"],["interesse_efter","job i plejen"]].filter(([k])=>!S.end[k]);
      if(m.length){ $("qerr").textContent = "Svar på: " + m.map(x=>x[1]).join(", ") + "."; return; }
      S.end.overrasket = $("surp").value.trim();
      Data.save("Slutninger",{player, nick:profile.nick, game:S.game, attempt:S.attempt, path:S.path, profile:prof, svaerest:+S.end.svaerest, synsaendring:+S.end.synsaendring, interesse_efter:S.end.interesse_efter, overrasket:S.end.overrasket, ansvar_efter:+S.end.ansvar_efter, svaert_efter:+S.end.svaert_efter, realisme:+S.end.realisme, ts:new Date().toISOString()});
      S.saved = true; render();
    };
    $("np").onclick = ()=>{ S.saved=false; newPlayer(); };
  }
  renderSide(); renderTimeline();
}

/* Skift til en ny node og vis dens info-kort. */
function goNode(id){ S.node = id; S.phase = "info"; S.fb = {}; render(); window.scrollTo({top:0,behavior:"smooth"}); }

/* [K15] NEDTÆLLINGEN. Tælleren viser hele sekunder tilbage (15 → 0) og bliver rød de sidste
   5 sekunder. Svartiden måles i millisekunder, og pulsen stiger, jo mindre tid der er
   tilbage. Når tiden er gået, kaldes choose("timeout") = game over ("så døde baby"). */
function startTimer(){
  S.t0 = performance.now();
  const tm = $("count"), num = $("countN"); tm.classList.add("on"); tm.classList.remove("low"); num.textContent = SECONDS;
  const r = roundOf(S.node), base = 95 + r*6;
  const tick = now=>{
    const left = Math.max(0, 1 - (now-S.t0)/(SECONDS*1000));
    num.textContent = Math.ceil(left*SECONDS);
    tm.classList.toggle("low", left*SECONDS <= 5);
    S.hr = base + (1-left)*45; $("hr").textContent = Math.round(S.hr);
    if(left<.34) $("monitor").classList.add("alarm");
    if(left<=0){ choose("timeout"); return; }
    S.raf = requestAnimationFrame(tick);
  };
  S.raf = requestAnimationFrame(tick);
}

/* [K16] row() bygger én datarække (én beslutning). choose() håndterer et valg:
   timeout og X1/X2 = game over, A/B = videre til feedback. Svartiden (ms) måles her. */
function row(r,k,out,ms){ return {player, nick:profile?profile.nick:"", game:S.game, attempt:S.attempt, node:S.node, round:r, choice:k, outcome:out, ms, stress:"", sikkerhed:"", styret:"", ansvar:"", ansvar_foelt:"", ts:new Date().toISOString()}; }
function choose(k){
  if(S.phase!=="stress") return;
  stopTimer();
  const ms = Math.round(performance.now()-S.t0), n = N[S.node], r = roundOf(S.node);
  if(k==="timeout"){
    S.stress = Math.min(99, S.stress+15);
    S.pending = row(r,"timeout","død",ms);
    S.over = {kind:"død", choice:"", text:"Du nåede det ikke. Så døde baby."}; S.phase="over"; render(); return;
  }
  if(k==="X1"||k==="X2"){
    const [txt,out,kind] = n.c[k];
    S.stress = Math.min(99, S.stress+12);
    S.pending = row(r,k,kind,ms);
    S.over = {kind, choice:txt, text:out}; S.phase="over"; render(); return;
  }
  S.path += k; S.last = {k, row:row(r,k,"videre",ms)};
  S.stress = Math.min(99, S.stress + Math.max(2, Math.round(ms/1000)));
  S.phase="feedback"; render();
}

/* [K17] rate() kontrollerer at de fire spørgsmål er besvaret, gemmer rækken og går til
   næste node (R{runde+1}-{vej}) eller til slutskærmen efter runde 5. */
function rate(){
  if(S.phase!=="feedback") return;
  const m = [["stress","pres"],["sikkerhed","sikkerhed"],["ansvar_foelt","ansvar"],["styret","hvad der styrede dit valg"]].filter(([k])=>!S.fb[k]);
  if(m.length){ $("qerr").textContent = "Svar på: " + m.map(x=>x[1]).join(", ") + "."; return; }
  S.phase="rated";
  Object.assign(S.last.row, {stress:+S.fb.stress, sikkerhed:+S.fb.sikkerhed, ansvar_foelt:+S.fb.ansvar_foelt, styret:S.fb.styret});
  Data.save("Valg", S.last.row);
  S.stress = Math.min(99, S.stress + S.fb.stress*2);
  const r = roundOf(S.node);
  if(r===5){ S.saved=false; S.end={}; S.phase="end"; render(); return; }
  goNode(`R${r+1}-${S.path}`);
}

/* [K18] SMÅ HÆNDELSER: mus over et patientnavn lyser stuen op, klik på kaldenavnet
   skifter profil, tasterne 1-4 vælger svar. Til sidst: første render(). */
document.addEventListener("mouseover", e=>{
  const p = e.target.closest && e.target.closest(".pt");
  document.querySelectorAll(".bed.hot").forEach(b=>b.classList.remove("hot"));
  if(p){ const b = document.querySelector(`.bed[data-p="${p.dataset.p}"]`); b && b.classList.add("hot"); }
});
$("chipWho").onclick = ()=>{ if(["start","end","over","profile"].includes(S.phase)){ flushPending(); S.phase="profile"; render(); } };
addEventListener("keydown", e=>{
  if(S.phase==="stress" && /^[1-4]$/.test(e.key)){ const b = $("actions").querySelectorAll(".key")[+e.key-1]; b && b.click(); }
});
render();
</script>
